<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Text Trail</title>
  <style>
    @font-face {
      font-family: 'SFProKR';
      src: url('./public/SFProKR.woff2') format('woff2');
      font-weight: 100 900;
    }
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #hidden-input {
      opacity: 0;
      position: absolute;
      left: -9999px;
    }
  </style>
</head>
<body>
  <canvas id="main-canvas"></canvas>
  <textarea id="hidden-input" autocomplete="off"></textarea>
  <script type="module" src="main.js"></script>
</body>
</html>
